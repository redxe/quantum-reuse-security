name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"
          python -m pip install black==24.8.0

      - name: Run formatting checks
        run: |
          python -m black --target-version py39 --check src/quantum_reuse/circuits.py src/quantum_reuse/analysis.py src/quantum_reuse/cli.py src/quantum_reuse/measurements.py src/quantum_reuse/metrics.py src/quantum_reuse/state_preparation.py src/quantum_reuse/validation.py tests examples

      - name: Run lint checks
        run: |
          python -m flake8 src/quantum_reuse/circuits.py src/quantum_reuse/analysis.py src/quantum_reuse/cli.py src/quantum_reuse/measurements.py src/quantum_reuse/metrics.py src/quantum_reuse/state_preparation.py src/quantum_reuse/validation.py tests examples

      - name: Run tests
        run: pytest -q

  deterministic-output:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run deterministic analysis
        run: python -m quantum_reuse analyze --output ci_output

      - name: Verify regenerated deterministic outputs
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd

          expected_files = {
              "branch_conditioned_results.csv": "data/branch_conditioned_results.csv",
              "averaged_fifth_wire_states.csv": "data/averaged_fifth_wire_states.csv",
              "distinguishability_metrics.csv": "data/distinguishability_metrics.csv",
          }

          for generated, expected in expected_files.items():
              left = pd.read_csv(f"ci_output/{generated}")
              right = pd.read_csv(expected)

              if list(left.columns) != list(right.columns):
                  raise SystemExit(f"Column mismatch detected for {generated}")

              for col in left.columns:
                  if pd.api.types.is_numeric_dtype(left[col]):
                      if not np.allclose(
                          left[col].to_numpy(),
                          right[col].to_numpy(),
                          rtol=0.0,
                          atol=1e-12,
                          equal_nan=True,
                      ):
                          raise SystemExit(f"Numeric mismatch detected for {generated}:{col}")
                  else:
                      if not left[col].astype(str).equals(right[col].astype(str)):
                          raise SystemExit(f"Text mismatch detected for {generated}:{col}")
          print("Deterministic output comparison passed.")
          PY
