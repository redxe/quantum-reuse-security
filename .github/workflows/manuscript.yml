name: Manuscript

on:
  push:
    paths:
      - docs/paper/v0.7.0/**
      - .github/workflows/manuscript.yml
  pull_request:
    paths:
      - docs/paper/v0.7.0/**
      - .github/workflows/manuscript.yml

permissions:
  contents: read

jobs:
  manuscript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended biber

      - name: Build manuscript with latexmk
        id: build
        working-directory: docs/paper/v0.7.0
        continue-on-error: true
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -jobname=Vi_Connelly_Known_State_Qubits_Research_Draft_v0_7 main.tex 2>&1 | tee "$RUNNER_TEMP/manuscript-latexmk.log"

      - name: Scan TeX build log
        id: scan
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import sys

          log_path = Path(os.environ["RUNNER_TEMP"]) / "manuscript-latexmk.log"
          text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""

          patterns = {
              "undefined references": re.compile(r"undefined references", re.I),
              "undefined citations": re.compile(r"undefined citations|citation.*undefined", re.I),
              "duplicate labels": re.compile(r"multiply-defined labels|duplicate label", re.I),
              "missing files": re.compile(r"file not found|no file|cannot find file", re.I),
          }

          failures = [name for name, pattern in patterns.items() if pattern.search(text)]
          if failures:
              print("TeX log scan failed:")
              for item in failures:
                  print(f"- {item}")
              sys.exit(1)

          print("TeX log scan passed.")
          PY

      - name: Run manuscript audit
        id: audit
        if: always()
        continue-on-error: true
        working-directory: docs/paper/v0.7.0
        run: |
          cp data/manuscript_audit.txt "$RUNNER_TEMP/manuscript-audit.committed.txt"
          python src/audit_manuscript.py > "$RUNNER_TEMP/manuscript-audit.generated.txt"
          diff -u "$RUNNER_TEMP/manuscript-audit.committed.txt" data/manuscript_audit.txt > "$RUNNER_TEMP/manuscript-audit.diff"

      - name: Verify manifest inventory
        id: manifest
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import sys

          root = Path("docs/paper/v0.7.0")
          manifest_entries = [
              line.strip()
              for line in (root / "MANIFEST.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          tracked_entries = subprocess.check_output(
              ["git", "ls-files", "docs/paper/v0.7.0"],
              text=True,
          ).splitlines()
            excluded = {"MANIFEST.txt", "SHA256SUMS.txt"}
            expected_entries = [
              Path(path).relative_to(root).as_posix()
              for path in tracked_entries
              if Path(path).relative_to(root).as_posix() not in excluded
            ]

          missing = sorted(set(expected_entries) - set(manifest_entries))
          extra = sorted(set(manifest_entries) - set(expected_entries))

          report = ["Manifest inventory verification:"]
          if missing or extra:
              report.append("mismatch")
              for item in missing:
                  report.append(f"- missing from manifest: {item}")
              for item in extra:
                  report.append(f"- extra in manifest: {item}")
              (Path(os.environ["RUNNER_TEMP"]) / "manuscript-inventory.log").write_text("\n".join(report) + "\n", encoding="utf-8")
              print("\n".join(report))
              sys.exit(1)

          report.append("match")
          (Path(os.environ["RUNNER_TEMP"]) / "manuscript-inventory.log").write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Verify checksums
        id: checksums
        if: always()
        continue-on-error: true
        working-directory: docs/paper/v0.7.0
        run: |
          sha256sum -c SHA256SUMS.txt | tee "$RUNNER_TEMP/manuscript-checksums.log"

      - name: Upload manuscript artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-release-artifacts
          if-no-files-found: ignore
          path: |
            docs/paper/v0.7.0/Vi_Connelly_Known_State_Qubits_Research_Draft_v0_7.pdf
            docs/paper/v0.7.0/Vi_Connelly_Known_State_Qubits_Research_Draft_v0_7.log
            ${{ runner.temp }}/manuscript-latexmk.log
            ${{ runner.temp }}/manuscript-audit.committed.txt
            ${{ runner.temp }}/manuscript-audit.generated.txt
            ${{ runner.temp }}/manuscript-audit.diff
            ${{ runner.temp }}/manuscript-inventory.log
            ${{ runner.temp }}/manuscript-checksums.log

      - name: Fail if validation steps failed
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Manuscript build failed."
            exit 1
          fi
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "TeX log scan failed."
            exit 1
          fi
          if [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "Manuscript audit drift or failure detected."
            exit 1
          fi
          if [ "${{ steps.manifest.outcome }}" != "success" ]; then
            echo "Manifest inventory verification failed."
            exit 1
          fi
          if [ "${{ steps.checksums.outcome }}" != "success" ]; then
            echo "Checksum verification failed."
            exit 1
          fi